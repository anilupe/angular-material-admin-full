<app-breadcrumb [path]="routes.Users"></app-breadcrumb>

<div class="filter-form">
  <button mat-flat-button color="success" [routerLink]="routes.Users_CREATE">
    Nuevo
  </button>
  <button
    mat-flat-button
    color="success"
    class="filter-button"
    (click)="addFilter()"
  >
    Agregar filtro
  </button>

  <mat-card class="card" *ngIf="showFilters">
    <app-filter
      [filters]="filters"
      [config]="config"
      (clearFilterConfirmed)="clearFilters()"
      (deleteFilterConfirmed)="delFilter()"
      (submitConfirmed)="submitHandler($event)"
    ></app-filter>
  </mat-card>
</div>

<mat-card class="card">
  <mat-card-content class="card-content">
    <div class="table-title-wrapper">
      <p class="table-title">Usuarios</p>
    </div>

    <div class="table-wrapper">
      <table
        mat-table
        [dataSource]="dataSource"
        matSort
        matSortDisableClear="true"
        class="table"
        (matSortChange)="sort($event)"
      >
        <ng-container matColumnDef="firstName">
          <th
            mat-header-cell
            *matHeaderCellDef
            mat-sort-header
            class="table-header"
          >
            Nombre
          </th>
          <td
            mat-cell
            *matCellDef="let row"
            class="table-body"
            (click)="edit(row)"
          >
            {{ row.firstName }}
          </td>
        </ng-container>

        <ng-container matColumnDef="lastName">
          <th
            mat-header-cell
            *matHeaderCellDef
            mat-sort-header
            class="table-header"
          >
            Apellido
          </th>
          <td
            mat-cell
            *matCellDef="let row"
            class="table-body"
            (click)="edit(row)"
          >
            {{ row.lastName }}
          </td>
        </ng-container>

        <ng-container matColumnDef="email">
          <th
            mat-header-cell
            *matHeaderCellDef
            mat-sort-header
            class="table-header"
          >
            Correo
          </th>
          <td
            mat-cell
            *matCellDef="let row"
            class="table-body"
            (click)="edit(row)"
          >
            {{ row.email }}
          </td>
        </ng-container>

        <ng-container matColumnDef="phoneNumber">
          <th
            mat-header-cell
            *matHeaderCellDef
            mat-sort-header
            class="table-header"
          >
            Teléfono
          </th>
          <td
            mat-cell
            *matCellDef="let row"
            class="table-body"
            (click)="edit(row)"
          >
            {{ row.phoneNumber }}
          </td>
        </ng-container>

        <ng-container matColumnDef="store">
          <th
            mat-header-cell
            *matHeaderCellDef
            mat-sort-header
            class="table-header"
          >
            Tienda a la que pertenece
          </th>
          <td
            mat-cell
            *matCellDef="let row"
            class="table-body"
            (click)="edit(row)"
          >
            {{ row.store || 'Sin tienda asignada' }}
          </td>
        </ng-container>
        <ng-container matColumnDef="role">
          <th
            mat-header-cell
            *matHeaderCellDef
            mat-sort-header
            class="table-header"
          >
            Rol
          </th>
          <td
            mat-cell
            *matCellDef="let row"
            class="table-body"
            (click)="edit(row)"
          >
            {{ row.role }}
          </td>
        </ng-container>

        <ng-container matColumnDef="disabled">
          <th
            mat-header-cell
            *matHeaderCellDef
            mat-sort-header
            class="table-header"
          >
            Activo
          </th>
          <td
            mat-cell
            *matCellDef="let row"
            class="table-body"
            (click)="$event.stopPropagation()"
          >
            <mat-checkbox
              color="primary"
              [checked]="!row.disabled"
              disabled
            ></mat-checkbox>
          </td>
        </ng-container>

        <ng-container matColumnDef="actions">
          <th mat-header-cell *matHeaderCellDef class="table-header">
            Acciones
          </th>
          <td
            mat-cell
            *matCellDef="let row"
            class="table-body"
            (click)="$event.stopPropagation()"
          >
            <div class="table-buttons-wrapper">
              <button
                mat-flat-button
                color="success"
                class="table-button"
                (click)="edit(row.id)"
              >
                Editar
              </button>
              <button
                mat-flat-button
                color="warn"
                class="table-button"
                (click)="openDeleteModal(row.id)"
              >
                Eliminar
              </button>
            </div>
          </td>
        </ng-container>

        <!-- Render rows -->
        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr
          mat-row
          *matRowDef="let row; columns: displayedColumns"
          (click)="edit(row)"
        ></tr>
      </table>
    </div>

    <mat-paginator
      [pageSizeOptions]="[10, 20, 50, 100]"
      showFirstLastButtons
      (page)="setLimit($event)"
    ></mat-paginator>
  </mat-card-content>
</mat-card>
