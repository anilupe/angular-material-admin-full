<app-breadcrumb [path]="routes.Interes"></app-breadcrumb>

<mat-card class="card">
  <mat-card-title>
    <div class="header">
      <h4 class="h4">Tipos de Interés</h4>
      <button mat-flat-button color="primary" (click)="openDialog()">
        Crear nuevo
      </button>
    </div>
  </mat-card-title>

  <mat-card-content class="tabla-intereses">
    <table mat-table [dataSource]="intereses" class="mat-elevation-z1 full-width-table">
      <!-- Nombre -->
      <ng-container matColumnDef="nombre">
        <th mat-header-cell *matHeaderCellDef>Nombre</th>
        <td mat-cell *matCellDef="let element">{{ element.nombre }}</td>
      </ng-container>

      <!-- Porcentaje -->
      <ng-container matColumnDef="porcentaje">
        <th mat-header-cell *matHeaderCellDef>Porcentaje (%)</th>
        <td mat-cell *matCellDef="let element">{{ element.porcentaje }}</td>
      </ng-container>

      <!-- Estado -->
      <ng-container matColumnDef="estado">
        <th mat-header-cell *matHeaderCellDef>Estado</th>
        <td mat-cell *matCellDef="let element">
          <span [ngClass]="element.estado ? 'text-success' : 'text-warn'">
            {{ element.estado ? 'Activo' : 'Inactivo' }}
          </span>
        </td>
      </ng-container>

      <!-- Acciones -->
      <ng-container matColumnDef="acciones">
        <th mat-header-cell *matHeaderCellDef>Acciones</th>
        <td mat-cell *matCellDef="let element">
          <button mat-icon-button color="primary" (click)="openDialog(element)">
            <mat-icon>edit</mat-icon>
          </button>
          <button mat-icon-button color="warn" (click)="eliminar(element.id)">
            <mat-icon>delete</mat-icon>
          </button>
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
    </table>
  </mat-card-content>
</mat-card>
