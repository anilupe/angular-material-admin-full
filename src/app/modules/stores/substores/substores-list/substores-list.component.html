<app-breadcrumb [path]="routes.SubStores"></app-breadcrumb>

<div class="filter-form">
  <button mat-flat-button color="success" routerLink="/tiendas/substores/new">
    Nueva subtienda
  </button>
</div>

<mat-card class="card">
  <mat-card-content class="card-content">
    <p class="table-title">Subtiendas</p>

    <div class="table-wrapper">
      <table
        mat-table
        [dataSource]="dataSource"
        class="table"
        matSort
        matSortDisableClear="true"
      >
        <!-- Tienda principal -->
        <ng-container matColumnDef="tiendaPrincipal">
          <th mat-header-cell *matHeaderCellDef mat-sort-header>
            Tienda Principal
          </th>
          <td mat-cell *matCellDef="let element">
            {{ nombreTienda || '-' }}
          </td>
        </ng-container>

        <!-- Nombre -->
        <ng-container matColumnDef="nombre">
          <th mat-header-cell *matHeaderCellDef mat-sort-header>Nombre</th>
          <td mat-cell *matCellDef="let row" (click)="edit(row)">
            {{ row.nombre }}
          </td>
        </ng-container>

        <!-- Dirección -->
        <ng-container matColumnDef="direccion">
          <th mat-header-cell *matHeaderCellDef mat-sort-header>Dirección</th>
          <td mat-cell *matCellDef="let row" (click)="edit(row)">
            {{ row.direccion }}
          </td>
        </ng-container>

        <!-- Teléfono -->
        <ng-container matColumnDef="telefono">
          <th mat-header-cell *matHeaderCellDef mat-sort-header>Teléfono</th>
          <td mat-cell *matCellDef="let row" (click)="edit(row)">
            {{ row.telefono }}
          </td>
        </ng-container>

        <!-- Ciudad -->
        <ng-container matColumnDef="ciudad">
          <th mat-header-cell *matHeaderCellDef mat-sort-header>Ciudad</th>
          <td mat-cell *matCellDef="let row" (click)="edit(row)">
            {{ row.ciudad || '-' }}
          </td>
        </ng-container>

        <!-- RUC -->
        <ng-container matColumnDef="ruc">
          <th mat-header-cell *matHeaderCellDef mat-sort-header>RUC</th>
          <td mat-cell *matCellDef="let row" (click)="edit(row)">
            {{ row.ruc }}
          </td>
        </ng-container>

        <!-- Acciones -->
        <ng-container matColumnDef="acciones">
          <th mat-header-cell *matHeaderCellDef>Acciones</th>
          <td mat-cell *matCellDef="let row" class="acciones-cell">
            <button mat-flat-button color="primary" (click)="edit(row)">
              Editar
            </button>
            <button mat-flat-button color="warn" (click)="delete(row.id)">
              Eliminar
            </button>
          </td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr
          mat-row
          *matRowDef="let row; columns: displayedColumns"
          class="table-row"
        ></tr>
      </table>
    </div>

    <mat-paginator
      [pageSizeOptions]="[5, 10, 20]"
      showFirstLastButtons
    ></mat-paginator>
  </mat-card-content>
</mat-card>
